name: Application Android TV

on:
  push:
    paths:
      - 'src/**'
      - 'android/**'
      - 'build.sh'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Préparer la page du jeu (hors ligne)
        run: ./build.sh

      - name: Clé de signature (secrets facultatifs)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_B64" | base64 -d > android/keystore/release.jks
          else
            echo "Pas de secret ANDROID_KEYSTORE_BASE64 : signature avec une clé de débogage."
          fi

      - name: Construire l'APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk jeu-de-l-oie-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jeu-de-l-oie-tv
          path: jeu-de-l-oie-tv.apk

      - name: Publier dans la release « android-tv »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-tv --cleanup-tag --yes || true
          gh release create android-tv jeu-de-l-oie-tv.apk \
            --target "$GITHUB_SHA" \
            --title "Jeu de l'Oie – Android TV (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK à installer sur un téléviseur Android TV / Google TV (TCL, etc.). Construit depuis la branche ${GITHUB_REF_NAME}."
