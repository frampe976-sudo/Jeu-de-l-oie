plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'fr.jeudeloie.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.jeudeloie.tv'
        minSdk 21
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Signature : clé fournie par les secrets GitHub si présents (mises à jour sans désinstaller),
    // sinon clé de débogage générée sur la machine de construction.
    def ksFile = file('../keystore/release.jks')
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
